<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOODZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.0.9/css/boxicons.min.css" rel="stylesheet">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Other head elements -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body class="text-[#515151]">

    <section class="grid col-span-1 md:grid-cols-2 gap-5 h-screen">
        <div class="col-span-1 hidden md:flex">
            <img src="{% static 'web/images/rest1.png' %}" alt="image" class="w-full">
        </div>
        <div class="col-span-1 h-screen flex justify-center items-center">
            <div class="text-center items-center">
                <h1 class="text-[32px] font-semibold mb-5">LOGIN NOW</h1>
                <P class="w-[90%] md:w-[70%] mb-5 m-auto">Lorem ipsum dolor sit amet consectetur adipisicing elit. Est repellendus laboriosam architecto impedit porro voluptas.</P>
                <form id="login-form" action="{% url 'web:ajaxlogin2' %}" method="post">
                    {% csrf_token %}
                    <input type="text" placeholder="Enter your Email" id="email" name="email">
                    <input type="password" placeholder="Enter your Password" id="password" name="password">
                    <button id="btn" type="button">LOGIN</button>
                </form>
                <span id="error" style="color: brown;"></span>
                
                {% if error %}
                <p>{{ message }}</p>
                {% endif %}
                <p class="text-[14px] mt-5">Don't Have an Account <a class="text-red-500" href="{% url 'web:register' %}">Sign Up</a></p>
            </div>
        </div>
    </section>

    <script>
        $('#btn').click(() => {
            var email = $('#email').val();
            var password = $('#password').val();
            var data = {
                'csrfmiddlewaretoken': $('input[name="csrfmiddlewaretoken"]').val(),
                'email': email,
                'password': password
            }
            if (email == ''){
                $('#error').html('Please enter a valid email address');
            }
            else if (password == ''){
                $('#error').html('Please enter a valid password');
            }
            else {
                $.ajax({
                    url: "{% url 'web:ajaxlogin2' %}",
                    data: data,
                    dataType: 'json',
                    success: function(data){
                        if (data.success){
                            alert('success');
                            window.location.replace('/');
                        }else{
                            $('#error').html('email or password is incorrect');
                        }
                    }
                })
            }
        })
    </script>
    

</body>
</html>
